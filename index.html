<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fire Hotspot Monitoring</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🔥 Fire Hotspot Monitoring</h1>
      <p>NASA FIRMS • VIIRS NOAA-20 / NOAA-21</p>
    </div>
    <div id="lastUpdate">Memuat data...</div>
  </header>

  <main class="app">
    <aside class="sidebar">
      <section class="panel">
        <h2>Filter</h2>
        <label for="confidence">Confidence</label>
        <select id="confidence">
          <option value="all">Semua</option>
          <option value="high">High</option>
          <option value="nominal">Nominal</option>
          <option value="low">Low</option>
        </select>

        <label for="satellite">Satelit</label>
        <select id="satellite">
          <option value="all">Semua</option>
          <option value="N20">NOAA-20</option>
          <option value="N21">NOAA-21</option>
        </select>

        <button id="reset">Reset filter</button>
      </section>

      <section class="stats">
        <div><span>Total</span><strong id="total">0</strong></div>
        <div><span>High</span><strong id="high">0</strong></div>
        <div><span>Nominal</span><strong id="nominal">0</strong></div>
        <div><span>Low</span><strong id="low">0</strong></div>
      </section>

      <section class="panel legend">
        <h2>Legenda</h2>
        <p><span class="dot high"></span> High</p>
        <p><span class="dot nominal"></span> Nominal</p>
        <p><span class="dot low"></span> Low</p>
      </section>

      <section class="panel">
        <p class="source">
          Sumber data: NASA FIRMS. Data hotspot adalah deteksi satelit dan bukan
          bukti pasti bahwa seluruh titik merupakan kebakaran aktif.
        </p>
      </section>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div id="popup" class="popup" hidden>
        <button id="popupClose">×</button>
        <div id="popupContent"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
